<!DOCTYPE html>
<html lang="en-NZ">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VUW Bus Departures - Static Display</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Only disable the CSS animation that conflicts with JavaScript */
        .ticker-scroll {
            animation: none !important;
        }
    </style>
    <script>
        // Simplified platform configuration for ScreenCloud on Tizen and LG WebOS
        window.PLATFORM_CONFIG = {
            isTizen: false,
            isWebOS: false,
            devicePixelRatio: window.devicePixelRatio || 1,
            viewportWidth: window.innerWidth,
            viewportHeight: window.innerHeight,
            scaleFactor: 1
        };

        // Detect ScreenCloud platforms
        function detectPlatform() {
            const ua = navigator.userAgent.toLowerCase();
            const isTizen = ua.includes('tizen') || ua.includes('samsung');
            const isWebOS = ua.includes('webos') || ua.includes('web0s');
            
            if (isTizen) {
                PLATFORM_CONFIG.isTizen = true;
                PLATFORM_CONFIG.scaleFactor = 0.95;
            } else if (isWebOS) {
                PLATFORM_CONFIG.isWebOS = true;
                PLATFORM_CONFIG.scaleFactor = 0.9;
            }
            
            // Calculate dynamic scale factor based on viewport
            const targetWidth = 3840;
            const targetHeight = 360;
            const widthRatio = window.innerWidth / targetWidth;
            const heightRatio = window.innerHeight / targetHeight;
            const dynamicScale = Math.min(widthRatio, heightRatio);
            
            // Apply platform-specific adjustments
            PLATFORM_CONFIG.scaleFactor = Math.min(PLATFORM_CONFIG.scaleFactor, dynamicScale);
            
            console.log('Platform detected:', PLATFORM_CONFIG);
        }

        // Apply scaling immediately
        detectPlatform();
        
        // Override scroll speed for ScreenCloud platforms
        window.addEventListener('DOMContentLoaded', function() {
            const originalCalculateScrollSpeed = window.calculateScrollSpeed;
            if (originalCalculateScrollSpeed) {
                window.calculateScrollSpeed = function() {
                    let baseSpeed = 1.5; // Default speed
                    
                    if (PLATFORM_CONFIG.isTizen) {
                        baseSpeed = 1.0; // Moderate speed for Tizen
                    } else if (PLATFORM_CONFIG.isWebOS) {
                        baseSpeed = 0.8; // Slightly slower for WebOS
                    }
                    
                    // Scale based on viewport width
                    const viewportWidth = window.innerWidth;
                    const speedMultiplier = Math.max(0.5, Math.min(2.0, viewportWidth / 1920));
                    
                    return baseSpeed * speedMultiplier;
                };
            }
        });
        
        // Remove the 100ms delay from populateTicker
        window.addEventListener('DOMContentLoaded', function() {
            const originalPopulateTicker = window.populateTicker;
            if (originalPopulateTicker) {
                window.populateTicker = function() {
                    originalPopulateTicker.call(this);
                    // Remove the setTimeout delay - start animation immediately
                    window.scrollPosition = 0;
                    const tickerScroll = document.getElementById('tickerScroll');
                    if (tickerScroll) {
                        window.scrollWidth = tickerScroll.scrollWidth;
                        if (window.startScrollAnimation) {
                            window.startScrollAnimation();
                        }
                    }
                };
            }
        });
    </script>
</head>
<body>
        <div class="departures-container">
            <div class="departures-header">
                <h1>Bus Departures - Live</h1>
                <div class="current-time" id="currentTime"></div>
            </div>
            <div class="departures-scroll" id="departuresScroll">
                <div class="departure-item">
                    <div class="route-info">
                        <div class="route-number">...</div>
                        <div class="route-destination">Loading Bus Times</div>
                    </div>
                    <div class="departure-times">
                        <div class="next-departure">Please wait...</div>
                        <div class="following-departure"></div>
                    </div>
                    <div class="status-info">
                        <div class="stop-info">Stop A</div>
                        <div class="status-badge">On time</div>
                    </div>
                </div>
            </div>
        </div>
    
    <script src="script.js"></script>
</body>
</html>
