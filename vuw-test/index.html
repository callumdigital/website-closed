<!DOCTYPE html>
<html lang="en-NZ">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VUW Kelburn Transport Ticker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Only disable the CSS animation that conflicts with JavaScript */
        .ticker-scroll {
            animation: none !important;
        }
    </style>
    <script>
        // Enhanced platform detection and scaling
        window.PLATFORM_CONFIG = {
            isEyemagnet: false,
            isOnelan: false,
            isTizen: false,
            devicePixelRatio: window.devicePixelRatio || 1,
            viewportWidth: window.innerWidth,
            viewportHeight: window.innerHeight,
            scaleFactor: 1
        };

        // Detect platform
        function detectPlatform() {
            const ua = navigator.userAgent.toLowerCase();
            const isChrome = ua.includes('chrome');
            const isTizen = ua.includes('tizen') || ua.includes('samsung');
            const hasHighDPR = window.devicePixelRatio > 1.5;
            const hasViewportMismatch = window.outerWidth < window.innerWidth;
            
            // Eyemagnet detection (Chrome-based with specific characteristics)
            if (isChrome && (hasViewportMismatch || hasHighDPR)) {
                PLATFORM_CONFIG.isEyemagnet = true;
                PLATFORM_CONFIG.scaleFactor = 0.8; // Conservative scaling for Eyemagnet
            }
            
            // Tizen detection
            if (isTizen) {
                PLATFORM_CONFIG.isTizen = true;
                PLATFORM_CONFIG.scaleFactor = 0.9;
            }
            
            // Onelan detection (typically has specific viewport characteristics)
            if (!isChrome && !isTizen && window.innerWidth >= 1920) {
                PLATFORM_CONFIG.isOnelan = true;
                PLATFORM_CONFIG.scaleFactor = 1.0;
            }
            
            // Calculate dynamic scale factor based on viewport
            const targetWidth = 3840;
            const targetHeight = 360;
            const widthRatio = window.innerWidth / targetWidth;
            const heightRatio = window.innerHeight / targetHeight;
            const dynamicScale = Math.min(widthRatio, heightRatio);
            
            // Apply platform-specific adjustments
            PLATFORM_CONFIG.scaleFactor = Math.min(PLATFORM_CONFIG.scaleFactor, dynamicScale);
            
            console.log('Platform detected:', PLATFORM_CONFIG);
        }

        // Apply scaling immediately
        detectPlatform();
        
        // Override scroll speed for specific platforms
        window.addEventListener('DOMContentLoaded', function() {
            const originalCalculateScrollSpeed = window.calculateScrollSpeed;
            if (originalCalculateScrollSpeed) {
                window.calculateScrollSpeed = function() {
                    let baseSpeed = 2;
                    
                    if (PLATFORM_CONFIG.isEyemagnet) {
                        baseSpeed = 0.5; // Much slower for Eyemagnet
                    } else if (PLATFORM_CONFIG.isTizen) {
                        baseSpeed = 1.0; // Moderate speed for Tizen
                    } else if (PLATFORM_CONFIG.isOnelan) {
                        baseSpeed = 2.5; // Faster for Onelan
                    }
                    
                    // Scale based on viewport width
                    const viewportWidth = window.innerWidth;
                    const speedMultiplier = Math.max(0.5, Math.min(2.0, viewportWidth / 1920));
                    
                    return baseSpeed * speedMultiplier;
                };
            }
        });
        
        // Remove the 100ms delay from populateTicker
        window.addEventListener('DOMContentLoaded', function() {
            const originalPopulateTicker = window.populateTicker;
            if (originalPopulateTicker) {
                window.populateTicker = function() {
                    originalPopulateTicker.call(this);
                    // Remove the setTimeout delay - start animation immediately
                    window.scrollPosition = 0;
                    const tickerScroll = document.getElementById('tickerScroll');
                    if (tickerScroll) {
                        window.scrollWidth = tickerScroll.scrollWidth;
                        if (window.startScrollAnimation) {
                            window.startScrollAnimation();
                        }
                    }
                };
            }
        });
    </script>
</head>
<body>
    <div class="ticker-container">
        <div class="ticker-scroll" id="tickerScroll">
            <div class="transport-item">
                <div class="bus-section">
                    <div class="bus-badge">...</div>
                </div>
                <div class="transport-info">
                    <div class="destination">Loading Bus Times</div>
                    <div class="time">Please wait...</div>
                </div>
            </div>
        </div>
    </div>
    
    <div id="currentTime" style="display: none;"></div>
    
    <script src="script.js"></script>
</body>
</html>
